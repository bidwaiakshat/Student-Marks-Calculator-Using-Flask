
<!DOCTYPE html>
<html>
<head>
    <title>Calculation Result</title>
</head>
<body>
    <h1>Student Result</h1>

    <h2>Hello, {{ name }}!</h2>

    <p>Mathematics: {{ marks[0] }}</p>
    <p>Science: {{ marks[1] }}</p>
    <p>Computer Science: {{ marks[2] }}</p>
    <p>English: {{ marks[3] }}</p>
    <p>Social Studies: {{ marks[4] }}</p>
    <h3>Total: {{ total }} / 500</h3>
    <h3>Percentage: {{ percentage }}%</h3>
    <h3>Result: {{ result }}</h3>

    <a href="/">Calculate Again</a>
</body>
</html>
